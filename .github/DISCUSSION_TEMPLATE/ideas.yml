body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Privacidad**: este foro es público. **No publiques informes PDF, capturas
        con datos de salud ni datos personales.** Las ideas se valoran según la
        [política de contribuciones](https://github.com/gabimarti/analitix/blob/main/docs/POLITICA_CONTRIBUCIONES.md)
        (seguridad, privacidad e integridad).
  - type: textarea
    id: idea
    attributes:
      label: Tu idea
      description: Qué te gustaría que hiciera Analitix y para qué te serviría.
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Fuente (si es un cálculo o un dato clínico)
      description: Artículo, guía o estudio que lo respalde (DOI o enlace), si lo conoces.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He comprobado que mi mensaje no contiene datos de salud ni datos personales reales.
          required: true
