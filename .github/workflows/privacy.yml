name: Privacy and secrets

# Repositorio público con un proyecto de datos de salud: en cada push/PR
# comprueba que no se versionan datos reales (PDF, bases de datos, hojas de
# cálculo, DNI/NIE válidos — scripts/check_privacy.py) ni secretos
# (gitleaks, sobre todo el historial).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for personal data
        run: python3 scripts/check_privacy.py

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
