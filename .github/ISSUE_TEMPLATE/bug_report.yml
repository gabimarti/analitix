name: Error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Privacidad**: esta issue es pública. **No adjuntes informes PDF reales,
        capturas con datos de salud ni datos personales** (nombre, DNI, NHC, fecha de
        nacimiento, resultados). Si hace falta un PDF para reproducir el problema, lee
        la sección de privacidad de [CONTRIBUTING.md](https://github.com/gabimarti/analitix/blob/main/CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: Versión
      description: Menú Ayuda → Acerca de.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Instalación
      options:
        - Instalador de Windows
        - Código fuente
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué ocurre
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Extracto de analitix.log (opcional)
      description: Revisa que no contenga nombres de fichero con datos personales antes de pegarlo.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He comprobado que esta issue no contiene datos de salud ni datos personales reales.
          required: true
