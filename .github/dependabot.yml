# Actualizaciones automáticas por PR: dependencias de Python
# (requirements*.txt) y las Actions de los workflows (fijadas por hash).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # Los requisitos son mínimos (">="): CI ya instala siempre la última
    # versión, así que solo se propone un cambio si una versión nueva queda
    # fuera del rango. Las actualizaciones de seguridad van aparte
    # (Dependabot alerts / security updates).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
